name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ErpDoctor.sln

      - name: Build
        run: dotnet build ErpDoctor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ErpDoctor.sln --configuration Release --no-build

      - name: Pack global tool and Plugin SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/nuget | Out-Null
          dotnet pack src/ErpDoctor.Cli/ErpDoctor.Cli.csproj `
            --configuration Release `
            --no-build `
            --output artifacts/nuget `
            -p:Version=0.0.0-ci
          dotnet pack src/ErpDoctor.PluginSdk/ErpDoctor.PluginSdk.csproj `
            --configuration Release `
            --no-build `
            --output artifacts/nuget `
            -p:Version=0.0.0-ci

      - name: Install packaged tool and run help
        shell: pwsh
        run: |
          dotnet tool install `
            --tool-path artifacts/tool-smoke `
            ErpDoctor.Tool `
            --version 0.0.0-ci `
            --add-source "$PWD/artifacts/nuget"
          & .\artifacts\tool-smoke\erp-doctor.exe --help

      - name: Smoke test JSON-only stdout mode
        shell: pwsh
        run: |
          $tool = Join-Path $PWD "artifacts/tool-smoke/erp-doctor.exe"

          $json = & $tool system --json -
          $diagnosticExit = $LASTEXITCODE
          if ($diagnosticExit -gt 1) {
            throw "JSON stdout diagnostic exited unexpectedly with code $diagnosticExit."
          }

          if ($json.Count -ne 1) {
            throw "Expected exactly one compact JSON stdout line, received $($json.Count)."
          }

          $report = $json | ConvertFrom-Json -ErrorAction Stop
          if ($report.schemaVersion -ne "1.0") {
            throw "Unexpected diagnostic schemaVersion '$($report.schemaVersion)'."
          }
          if ($null -eq $report.results -or $report.results.Count -eq 0) {
            throw "JSON stdout report contained no diagnostic results."
          }
          if ($json -match "Health score:" -or $json -match "Summary:") {
            throw "Human console output leaked into JSON stdout mode."
          }

          $conflictOutput = & $tool system --json - --html artifacts/should-not-exist.html 2>$null
          if ($LASTEXITCODE -ne 2) {
            throw "Expected --json - / --html conflict to return usage exit code 2."
          }
          if ($conflictOutput) {
            throw "Conflicting JSON stdout invocation wrote to stdout."
          }
          if (Test-Path "artifacts/should-not-exist.html") {
            throw "Conflicting JSON stdout invocation created an HTML artifact."
          }

          # The last native command intentionally returned 2 for the conflict assertion.
          # Reset it so GitHub's PowerShell wrapper does not treat that expected value as the step result.
          $global:LASTEXITCODE = 0

      - name: Smoke test packaged report diff regression gate
        shell: pwsh
        run: |
          $tool = Join-Path $PWD "artifacts/tool-smoke/erp-doctor.exe"
          $beforePath = Join-Path $PWD "artifacts/report-before.json"
          $afterPath = Join-Path $PWD "artifacts/report-after.json"

          @'
          {
            "schemaVersion": "1.0",
            "generatedAtUtc": "2026-08-13T04:00:00+00:00",
            "overallStatus": "healthy",
            "healthScore": 100,
            "summary": { "total": 2, "healthy": 2, "info": 0, "warning": 0, "critical": 0, "skipped": 0, "error": 0 },
            "results": [
              { "checkId": "system.cpu", "name": "System CPU", "status": "healthy", "summary": "CPU is healthy.", "evidence": {}, "suggestions": [] },
              { "checkId": "system.memory", "name": "System memory", "status": "healthy", "summary": "Memory is healthy.", "evidence": {}, "suggestions": [] }
            ],
            "diagnoses": []
          }
          '@ | Set-Content -LiteralPath $beforePath -Encoding utf8

          @'
          {
            "schemaVersion": "1.0",
            "generatedAtUtc": "2026-08-13T04:05:00+00:00",
            "overallStatus": "warning",
            "healthScore": 80,
            "summary": { "total": 2, "healthy": 1, "info": 0, "warning": 1, "critical": 0, "skipped": 0, "error": 0 },
            "results": [
              { "checkId": "system.cpu", "name": "System CPU", "status": "warning", "summary": "CPU pressure increased.", "evidence": {}, "suggestions": [] },
              { "checkId": "system.memory", "name": "System memory", "status": "healthy", "summary": "Memory is healthy.", "evidence": {}, "suggestions": [] }
            ],
            "diagnoses": []
          }
          '@ | Set-Content -LiteralPath $afterPath -Encoding utf8

          $human = & $tool report-diff --left $beforePath --right $afterPath 2>&1
          if ($LASTEXITCODE -ne 1) {
            $human | Out-Host
            throw "Expected report-diff regression exit code 1."
          }
          if (($human -join "`n") -notmatch "Regression gate\s+FAIL") {
            $human | Out-Host
            throw "Human report-diff output did not show a failed regression gate."
          }

          $json = & $tool report-diff --left $beforePath --right $afterPath --json -
          if ($LASTEXITCODE -ne 1) {
            throw "Expected JSON report-diff regression exit code 1."
          }
          if ($json.Count -ne 1) {
            throw "Expected report-diff --json - to emit one compact JSON line."
          }

          $diff = $json | ConvertFrom-Json -ErrorAction Stop
          if ($diff.schemaVersion -ne "1.0") {
            throw "Unexpected report diff schemaVersion '$($diff.schemaVersion)'."
          }
          if (-not $diff.hasRegression -or $diff.regressionCount -ne 1) {
            throw "Report diff JSON did not expose the expected regression gate."
          }
          if ($diff.healthScoreDelta -ne -20) {
            throw "Expected healthScoreDelta -20, got $($diff.healthScoreDelta)."
          }
          $cpu = $diff.changes | Where-Object { $_.checkId -eq "system.cpu" }
          if ($null -eq $cpu -or $cpu.kind -ne "regressed" -or $cpu.afterStatus -ne "warning") {
            throw "Report diff JSON did not classify system.cpu as regressed to warning."
          }

          $recoveryJson = & $tool report-diff --left $afterPath --right $beforePath --json -
          if ($LASTEXITCODE -ne 0) {
            throw "Expected recovery report-diff to exit 0."
          }
          $recovery = $recoveryJson | ConvertFrom-Json -ErrorAction Stop
          if ($recovery.hasRegression) {
            throw "Recovery report-diff unexpectedly reported a regression."
          }

          # Regression assertions intentionally exercised exit code 1 earlier.
          $global:LASTEXITCODE = 0

      - name: Validate installer script syntax and help
        shell: powershell
        run: |
          & .\scripts\install.ps1 -Help | Out-Host
          bash -n scripts/install.sh
          bash scripts/install.sh --help

      - name: Smoke test Windows installer with local release artifact
        shell: powershell
        run: |
          $source = Join-Path $PWD "src/ErpDoctor.Cli/bin/Release/net8.0"
          $packageDir = Join-Path $PWD "artifacts/installer-package"
          $archive = Join-Path $PWD "artifacts/erp-doctor-win-x64.zip"
          $checksums = Join-Path $PWD "artifacts/checksums.txt"
          $badChecksums = Join-Path $PWD "artifacts/bad-checksums.txt"
          $installDir = Join-Path $PWD "artifacts/installer-smoke"
          $badInstallDir = Join-Path $PWD "artifacts/installer-bad-checksum"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path (Join-Path $source "*") -Destination $packageDir -Recurse -Force
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $archive -Force

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksums -Value "$hash  erp-doctor-win-x64.zip" -NoNewline
          Set-Content -LiteralPath $badChecksums -Value "$('0' * 64)  erp-doctor-win-x64.zip" -NoNewline

          $badChecksumRejected = $false
          try {
            & .\scripts\install.ps1 `
              -ArchivePath $archive `
              -ChecksumsPath $badChecksums `
              -InstallDir $badInstallDir `
              -NoPathUpdate
          }
          catch {
            $badChecksumRejected = $true
          }

          if (-not $badChecksumRejected) {
            throw "Windows installer accepted an invalid SHA256 checksum."
          }

          & .\scripts\install.ps1 `
            -ArchivePath $archive `
            -ChecksumsPath $checksums `
            -InstallDir $installDir `
            -NoPathUpdate

          & (Join-Path $installDir "erp-doctor.exe") --help
