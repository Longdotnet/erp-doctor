name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ErpDoctor.sln

      - name: Build
        run: dotnet build ErpDoctor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ErpDoctor.sln --configuration Release --no-build
