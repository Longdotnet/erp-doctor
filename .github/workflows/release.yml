name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "agent/release-dry-run-*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer used for a packaging dry run (no release is created)"
        required: true
        default: "0.18.0-dev.1"

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve and validate version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="0.18.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Packaging ERP Doctor $VERSION"

      - name: Restore
        run: dotnet restore ErpDoctor.sln

      - name: Build
        run: dotnet build ErpDoctor.sln --configuration Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: dotnet test ErpDoctor.sln --configuration Release --no-build -p:Version="$VERSION"

      - name: Pack global tool and Plugin SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget

          dotnet pack src/ErpDoctor.Cli/ErpDoctor.Cli.csproj \
            --configuration Release \
            --no-build \
            --output artifacts/nuget \
            -p:Version="$VERSION"

          dotnet pack src/ErpDoctor.PluginSdk/ErpDoctor.PluginSdk.csproj \
            --configuration Release \
            --no-build \
            --output artifacts/nuget \
            -p:Version="$VERSION"

      - name: Publish standalone Windows x64
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/ErpDoctor.Cli/ErpDoctor.Cli.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output artifacts/win-x64 \
            -p:Version="$VERSION" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false

      - name: Publish standalone Linux x64
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/ErpDoctor.Cli/ErpDoctor.Cli.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output artifacts/linux-x64 \
            -p:Version="$VERSION" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false

      - name: Publish PostgreSQL plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish plugins/ErpDoctor.Plugin.Postgres/ErpDoctor.Plugin.Postgres.csproj \
            --configuration Release \
            --output artifacts/postgres-plugin \
            -p:Version="$VERSION"
          cp docs/postgres-plugin.md artifacts/postgres-plugin/README.md
          cp samples/postgres-plugin.example.json artifacts/postgres-plugin/postgres-plugin.example.json
          cp LICENSE artifacts/postgres-plugin/LICENSE

      - name: Publish Docker plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish plugins/ErpDoctor.Plugin.Docker/ErpDoctor.Plugin.Docker.csproj \
            --configuration Release \
            --output artifacts/docker-plugin \
            -p:Version="$VERSION"
          cp docs/docker-plugin.md artifacts/docker-plugin/README.md
          cp samples/docker-plugin.example.json artifacts/docker-plugin/docker-plugin.example.json
          cp LICENSE artifacts/docker-plugin/LICENSE

      - name: Publish Nginx plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish plugins/ErpDoctor.Plugin.Nginx/ErpDoctor.Plugin.Nginx.csproj \
            --configuration Release \
            --output artifacts/nginx-plugin \
            -p:Version="$VERSION"
          cp docs/nginx-plugin.md artifacts/nginx-plugin/README.md
          cp samples/nginx-plugin.example.json artifacts/nginx-plugin/nginx-plugin.example.json
          cp LICENSE artifacts/nginx-plugin/LICENSE

      - name: Publish Redis plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish plugins/ErpDoctor.Plugin.Redis/ErpDoctor.Plugin.Redis.csproj \
            --configuration Release \
            --output artifacts/redis-plugin \
            -p:Version="$VERSION"
          cp docs/redis-plugin.md artifacts/redis-plugin/README.md
          cp samples/redis-plugin.example.json artifacts/redis-plugin/redis-plugin.example.json
          cp LICENSE artifacts/redis-plugin/LICENSE

      - name: Publish RabbitMQ plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish plugins/ErpDoctor.Plugin.RabbitMq/ErpDoctor.Plugin.RabbitMq.csproj \
            --configuration Release \
            --output artifacts/rabbitmq-plugin \
            -p:Version="$VERSION"
          cp docs/rabbitmq-plugin.md artifacts/rabbitmq-plugin/README.md
          cp samples/rabbitmq-plugin.example.json artifacts/rabbitmq-plugin/rabbitmq-plugin.example.json
          cp LICENSE artifacts/rabbitmq-plugin/LICENSE

      - name: Smoke test standalone Linux build and plugin loading
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/linux-x64/ErpDoctor.Cli
          artifacts/linux-x64/ErpDoctor.Cli --help > /dev/null

          cat > artifacts/plugin-smoke.json <<JSON
          {
            "plugins": {
              "assemblies": [
                "$GITHUB_WORKSPACE/artifacts/postgres-plugin/ErpDoctor.Plugin.Postgres.dll",
                "$GITHUB_WORKSPACE/artifacts/docker-plugin/ErpDoctor.Plugin.Docker.dll",
                "$GITHUB_WORKSPACE/artifacts/nginx-plugin/ErpDoctor.Plugin.Nginx.dll",
                "$GITHUB_WORKSPACE/artifacts/redis-plugin/ErpDoctor.Plugin.Redis.dll",
                "$GITHUB_WORKSPACE/artifacts/rabbitmq-plugin/ErpDoctor.Plugin.RabbitMq.dll"
              ],
              "settings": {}
            }
          }
          JSON

          PLUGIN_OUTPUT="$(artifacts/linux-x64/ErpDoctor.Cli plugins --config artifacts/plugin-smoke.json)"
          echo "$PLUGIN_OUTPUT"
          grep -F "postgres" <<< "$PLUGIN_OUTPUT"
          grep -F "checks   : 4" <<< "$PLUGIN_OUTPUT"
          grep -F "docker" <<< "$PLUGIN_OUTPUT"
          grep -F "checks   : 3" <<< "$PLUGIN_OUTPUT"
          grep -F "nginx" <<< "$PLUGIN_OUTPUT"
          grep -F "Nginx Diagnostics" <<< "$PLUGIN_OUTPUT"
          grep -F "checks   : 2" <<< "$PLUGIN_OUTPUT"
          grep -F "redis" <<< "$PLUGIN_OUTPUT"
          grep -F "Redis Diagnostics" <<< "$PLUGIN_OUTPUT"
          grep -F "checks   : 5" <<< "$PLUGIN_OUTPUT"
          grep -F "rabbitmq" <<< "$PLUGIN_OUTPUT"
          grep -F "RabbitMQ Diagnostics" <<< "$PLUGIN_OUTPUT"

      - name: Smoke test standalone Linux network diagnostics
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 18080 --bind 127.0.0.1 \
            > artifacts/network-smoke-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          cat > artifacts/network-smoke.json <<JSON
          {
            "network": {
              "targets": [
                {
                  "name": "Loopback network smoke",
                  "host": "127.0.0.1",
                  "port": 18080,
                  "timeoutSeconds": 5,
                  "latencyWarningMs": 10000,
                  "maxResolvedAddresses": 2
                }
              ]
            }
          }
          JSON

          NETWORK_OUTPUT="$(artifacts/linux-x64/ErpDoctor.Cli network --config artifacts/network-smoke.json)"
          echo "$NETWORK_OUTPUT"
          grep -F "Loopback network smoke" <<< "$NETWORK_OUTPUT"

      - name: Smoke test standalone Linux system pressure diagnostics
        shell: bash
        run: |
          set -euo pipefail

          cat > artifacts/system-pressure-smoke.json <<JSON
          {
            "system": {
              "cpuWarningPercent": 100,
              "cpuCriticalPercent": 100,
              "cpuSampleMilliseconds": 100,
              "loadPerCpuWarning": 100,
              "loadPerCpuCritical": 200,
              "topProcessesLimit": 3
            }
          }
          JSON

          set +e
          SYSTEM_OUTPUT="$(artifacts/linux-x64/ErpDoctor.Cli system --config artifacts/system-pressure-smoke.json 2>&1)"
          SYSTEM_EXIT=$?
          set -e

          if [[ "$SYSTEM_EXIT" -gt 1 ]]; then
            echo "$SYSTEM_OUTPUT"
            echo "Unexpected System Doctor exit code: $SYSTEM_EXIT"
            exit 1
          fi

          echo "$SYSTEM_OUTPUT"
          grep -F "System CPU" <<< "$SYSTEM_OUTPUT"
          grep -F "System load average" <<< "$SYSTEM_OUTPUT"
          grep -F "Top processes by memory" <<< "$SYSTEM_OUTPUT"

          if grep -F "x System CPU" <<< "$SYSTEM_OUTPUT" || \
             grep -F "x System load average" <<< "$SYSTEM_OUTPUT" || \
             grep -F "x Top processes by memory" <<< "$SYSTEM_OUTPUT"; then
            echo "A v0.17 system-pressure check returned Error."
            exit 1
          fi

      - name: Smoke test standalone Linux JSON stdout integration
        shell: bash
        run: |
          set -euo pipefail

          set +e
          REPORT_JSON="$(artifacts/linux-x64/ErpDoctor.Cli system --config artifacts/system-pressure-smoke.json --json -)"
          REPORT_EXIT=$?
          set -e

          if [[ "$REPORT_EXIT" -gt 1 ]]; then
            echo "Unexpected JSON stdout diagnostic exit code: $REPORT_EXIT"
            exit 1
          fi

          if [[ "$(printf '%s\n' "$REPORT_JSON" | wc -l)" -ne 1 ]]; then
            echo "JSON stdout was not a single compact line."
            exit 1
          fi

          REPORT_JSON="$REPORT_JSON" python3 - <<'PY'
          import json
          import os

          report = json.loads(os.environ["REPORT_JSON"])
          assert report["schemaVersion"] == "1.0"
          assert isinstance(report["results"], list) and report["results"]
          assert "overallStatus" in report
          assert "summary" in report
          PY

          if grep -F "Health score:" <<< "$REPORT_JSON" || grep -F "Summary:" <<< "$REPORT_JSON"; then
            echo "Human console output leaked into JSON stdout mode."
            exit 1
          fi

          rm -f artifacts/json-stdout-conflict.html
          set +e
          CONFLICT_OUTPUT="$(artifacts/linux-x64/ErpDoctor.Cli system --json - --html artifacts/json-stdout-conflict.html 2>/dev/null)"
          CONFLICT_EXIT=$?
          set -e

          if [[ "$CONFLICT_EXIT" -ne 2 ]]; then
            echo "Expected JSON stdout / HTML conflict to return usage exit code 2."
            exit 1
          fi
          if [[ -n "$CONFLICT_OUTPUT" ]]; then
            echo "Conflicting JSON stdout invocation wrote to stdout."
            exit 1
          fi
          if [[ -e artifacts/json-stdout-conflict.html ]]; then
            echo "Conflicting JSON stdout invocation created an HTML artifact."
            exit 1
          fi

      - name: Build release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release

          cp LICENSE artifacts/win-x64/LICENSE
          cp samples/erp-doctor.example.json artifacts/win-x64/erp-doctor.example.json
          cp LICENSE artifacts/linux-x64/LICENSE
          cp samples/erp-doctor.example.json artifacts/linux-x64/erp-doctor.example.json

          (
            cd artifacts/win-x64
            zip -q -r ../release/erp-doctor-win-x64.zip .
          )

          tar -czf artifacts/release/erp-doctor-linux-x64.tar.gz \
            -C artifacts/linux-x64 .

          (
            cd artifacts/postgres-plugin
            zip -q -r ../release/erp-doctor-plugin-postgres.zip .
          )

          (
            cd artifacts/docker-plugin
            zip -q -r ../release/erp-doctor-plugin-docker.zip .
          )

          (
            cd artifacts/nginx-plugin
            zip -q -r ../release/erp-doctor-plugin-nginx.zip .
          )

          (
            cd artifacts/redis-plugin
            zip -q -r ../release/erp-doctor-plugin-redis.zip .
          )

          (
            cd artifacts/rabbitmq-plugin
            zip -q -r ../release/erp-doctor-plugin-rabbitmq.zip .
          )

          cp scripts/install.ps1 artifacts/release/install.ps1
          cp scripts/install.sh artifacts/release/install.sh
          chmod +x artifacts/release/install.sh
          cp artifacts/nuget/*.nupkg artifacts/release/

          (
            cd artifacts/release
            sha256sum \
              erp-doctor-win-x64.zip \
              erp-doctor-linux-x64.tar.gz \
              erp-doctor-plugin-postgres.zip \
              erp-doctor-plugin-docker.zip \
              erp-doctor-plugin-nginx.zip \
              erp-doctor-plugin-redis.zip \
              erp-doctor-plugin-rabbitmq.zip \
              install.ps1 \
              install.sh \
              *.nupkg > checksums.txt
          )

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release
          sha256sum -c checksums.txt

      - name: Smoke test Linux installer with packaged release
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_DIR="$GITHUB_WORKSPACE/artifacts/installer-smoke-linux"
          bash scripts/install.sh \
            --archive artifacts/release/erp-doctor-linux-x64.tar.gz \
            --checksums artifacts/release/checksums.txt \
            --install-dir "$INSTALL_DIR"
          "$INSTALL_DIR/erp-doctor" --help > /dev/null

      - name: Upload packaged release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: erp-doctor-${{ env.VERSION }}
          path: artifacts/release/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            artifacts/release/* \
            --verify-tag \
            --generate-notes \
            --title "ERP Doctor $GITHUB_REF_NAME"

      - name: Publish NuGet packages when API key is configured
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "NUGET_API_KEY is not configured; skipping NuGet.org publish."
            exit 0
          fi

          dotnet nuget push "artifacts/nuget/ErpDoctor.Tool.$VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

          dotnet nuget push "artifacts/nuget/ErpDoctor.PluginSdk.$VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
